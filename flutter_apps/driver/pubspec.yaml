name: chalao_driver
description: "Chalao Co-op Ride Sharing — Driver Partner App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2
  dio: ^5.7.0

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Audio (incoming ride alert)
  audioplayers: ^6.1.0

  # UI
  pinput: ^5.0.0
  shimmer: ^3.0.0
  lottie: ^3.1.3
  cached_network_image: ^3.4.1
  percent_indicator: ^4.2.3

  # Image / File
  image_picker: ^1.1.2
  file_picker: ^8.1.6

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Utils
  url_launcher: ^6.3.1
  intl: ^0.20.1
  provider: ^6.1.2
  connectivity_plus: ^6.1.1
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
