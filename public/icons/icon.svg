<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="chalaoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#059669" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="#020617" />
  
  <!-- Inner Gradient Emblem -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#chalaoGrad)" filter="url(#glow)" />
  
  <!-- Bengali Character 'চা' (Chalao Emblem) -->
  <text x="256" y="330" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="240" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-2">চা</text>
  
  <!-- Golden Ownership Star -->
  <circle cx="390" cy="120" r="28" fill="#f59e0b" />
  <polygon points="390,102 396,116 411,116 399,125 403,139 390,130 377,139 381,125 369,116 384,116" fill="#ffffff" />
</svg>
