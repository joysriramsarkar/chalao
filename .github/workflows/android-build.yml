name: Chalao Mobile Suite (Flutter Native + Capacitor Admin)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-admin-capacitor:
    name: Build Admin Capacitor APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm install

      - name: Build Next.js & Prepare Admin App
        run: npm run build:all

      - name: Build Admin APK (Capacitor)
        run: |
          cd apps/admin
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chalao-Admin-v1.0.0-Capacitor-APK
          path: apps/admin/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-flutter-apps:
    name: Build Flutter Native Apps (Rider & Driver)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Rider APK
        run: |
          cd flutter_apps/rider
          flutter pub get
          flutter build apk --debug

      - name: Build Flutter Driver APK
        run: |
          cd flutter_apps/driver
          flutter pub get
          flutter build apk --debug

      - name: Upload Flutter Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: Chalao-Rider-v1.0.0-Flutter-APK
          path: flutter_apps/rider/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload Flutter Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: Chalao-Driver-v1.0.0-Flutter-APK
          path: flutter_apps/driver/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
