name: Chalao Mobile Suite (All 6 Apps CI/CD)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-all-mobile-apps:
    name: Build Rider, Driver & Admin APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm install

      - name: Build Next.js & Prepare 3 Apps
        run: npm run build:all

      - name: Build Rider APK
        run: |
          cd apps/rider
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Build Driver APK
        run: |
          cd apps/driver
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Build Admin APK
        run: |
          cd apps/admin
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload Rider APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chalao-Rider-v1.0.0-APK
          path: apps/rider/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Driver APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chalao-Driver-v1.0.0-APK
          path: apps/driver/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chalao-Admin-v1.0.0-APK
          path: apps/admin/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
